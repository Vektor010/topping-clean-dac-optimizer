<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#00F260"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle Audio Waveform Grid -->
  <g opacity="0.12" stroke="#3A7BD5" stroke-width="1.5">
    <line x1="80" y1="480" x2="1200" y2="480"/>
    <line x1="80" y1="440" x2="1200" y2="440"/>
    <line x1="80" y1="520" x2="1200" y2="520"/>
  </g>

  <!-- Audio Wave graphic -->
  <path d="M 80 480 Q 180 340, 280 480 T 480 480 T 680 480 T 880 480 T 1080 480 T 1200 480" 
        fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.75"/>
  <path d="M 80 480 Q 220 390, 360 480 T 640 480 T 920 480 T 1200 480" 
        fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.4"/>

  <!-- Central Card -->
  <rect x="140" y="70" width="1000" height="420" rx="24" fill="url(#cardGlow)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Badge: 2026 Edition -->
  <rect x="180" y="110" width="180" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="270" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">2026 EDITION</text>

  <!-- Project Title -->
  <text x="180" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    TOPPING Clean DAC Optimizer
  </text>

  <!-- Slogan -->
  <text x="180" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Pure Sound. Zero Bloat. The clean, lightweight driver toolkit for TOPPING USB DACs.
  </text>

  <!-- Metric Badges inside Card -->
  <!-- Badge 1: 0 MB RAM -->
  <g transform="translate(180, 280)">
    <rect width="180" height="74" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="90" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#22c55e" text-anchor="middle">0 MB RAM</text>
    <text x="90" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">ZERO RESIDENT BLOAT</text>
  </g>

  <!-- Badge 2: Thesycon WHQL -->
  <g transform="translate(380, 280)">
    <rect width="210" height="74" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">Thesycon v6.16.0</text>
    <text x="105" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">WHQL CERTIFIED KERNEL</text>
  </g>

  <!-- Badge 3: Bit-Perfect 768kHz -->
  <g transform="translate(610, 280)">
    <rect width="230" height="74" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="115" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#a855f7" text-anchor="middle">32-bit / 768 kHz</text>
    <text x="115" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">BIT-PERFECT &amp; DSD512</text>
  </g>

  <!-- Badge 4: Win 11 26H2 / 24H2 & 10 -->
  <g transform="translate(860, 280)">
    <rect width="240" height="74" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f59e0b" text-anchor="middle">Win 11 (26H2) &amp; 10</text>
    <text x="120" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">TESTED &amp; VERIFIED</text>
  </g>

  <!-- Footer Tagline inside Card -->
  <text x="180" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
    Supports all TOPPING USB DACs: DX1, DX3 Pro+, DX5, DX7, E30, E50, E70, D10s, D50, D70, D90, G5
  </text>
</svg>
